<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v2 Todo list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top">
        <button class="theme">Change theme</button>
        <input type="text" class="search" placeholder="Search your task">
    </div>
    <div class="container">
        <div class="stats-container">
            <div class="details">
                <h1>Todo App</h1>
                <p>Keep it up!</p>
                <div id="progressBar">
                    <div id="progress"></div>
                </div>
            </div>
            <div class="stats-numbers">
                <p id="numbers">0/0</p>
            </div>
        </div>

        <form action="">
            <input type="text" placeholder="Add your task" id="taskInput">
            <button type="submit" id="newTask">+</button>
        </form>

        <ul class="task-list"></ul>
    </div>
<script src="script.js"></script>
</body>
</html>
